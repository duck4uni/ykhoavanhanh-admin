image: docker:27-cli

stages:
  - source
  - build
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

.job_base: &job_base
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_COMMIT_REF_NAME == "release/prod"'

source:
  stage: source
  <<: *job_base
  tags:
    - client-200
  before_script:
    - apk add --no-cache bash
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
  script:
    - bash cicd/source.sh
  artifacts:
    paths:
      - cicd-release.env
    expire_in: 1 day

build:image:
  stage: build
  <<: *job_base
  tags:
    - client-200
  dependencies:
    - source
  before_script:
    - apk add --no-cache bash
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
    - if [ -f cicd-release.env ]; then set -a; . ./cicd-release.env; set +a; fi
  script:
    - bash cicd/build.sh

deploy:production:
  stage: deploy
  <<: *job_base
  tags:
    - client-200
  dependencies:
    - source
  before_script:
    - apk add --no-cache bash
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
    - if [ -f cicd-release.env ]; then set -a; . ./cicd-release.env; set +a; fi
    - . cicd/env-param.sh
    - cp "$env_file" .env
  script:
    - bash cicd/deploy-production.sh
  after_script:
    - echo "deploy:production finished - status=$CI_JOB_STATUS"
  environment:
    name: production
    url: https://gateway.dev.meu-solutions.com/vh-hospital
